<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord | Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 127.14 96.36'><path fill='%235865F2' d='M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z'/></svg>">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">

  <!-- Back to Landing Page Link -->
  <a href="../index.html" class="login-back-home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    Back to Home
  </a>

  <!-- Central Authentication Card -->
  <div class="login-card">
    
    <!-- Left Column: Form -->
    <div class="login-form-col">
      <div class="login-header">
        <h1 class="login-title">Welcome back!</h1>
        <p class="login-subtitle">We're so excited to see you again!</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); alert('Demo: Logged in successfully!');">
        <!-- Email/Phone Input -->
        <div class="form-group">
          <label class="form-label" for="userEmail">
            Email or Phone Number <span class="required">*</span>
          </label>
          <input type="text" id="userEmail" class="form-input" required autocomplete="username">
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label class="form-label" for="userPassword">
            Password <span class="required">*</span>
          </label>
          <input type="password" id="userPassword" class="form-input" required autocomplete="current-password">
          <a href="#" class="forgot-link">Forgot your password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn login-submit-btn">Log In</button>

        <!-- Register Link -->
        <p class="register-prompt">
          Need an account? <a href="#">Register</a>
        </p>
      </form>
    </div>

    <!-- Right Column: QR Code Instant Access -->
    <div class="login-qr-col">
      <div class="qr-frame">
        <!-- Scalable QR Code Pattern Mockup -->
        <svg class="qr-code-svg" viewBox="0 0 100 100" fill="#23272A">
          <!-- Top Left Finder Pattern -->
          <rect x="5" y="5" width="26" height="26" rx="4" />
          <rect x="9" y="9" width="18" height="18" rx="2" fill="#FFFFFF" />
          <rect x="13" y="13" width="10" height="10" rx="2" />
          
          <!-- Top Right Finder Pattern -->
          <rect x="69" y="5" width="26" height="26" rx="4" />
          <rect x="73" y="9" width="18" height="18" rx="2" fill="#FFFFFF" />
          <rect x="77" y="13" width="10" height="10" rx="2" />

          <!-- Bottom Left Finder Pattern -->
          <rect x="5" y="69" width="26" height="26" rx="4" />
          <rect x="9" y="73" width="18" height="18" rx="2" fill="#FFFFFF" />
          <rect x="13" y="77" width="10" height="10" rx="2" />

          <!-- Scattered QR Data Blocks -->
          <rect x="36" y="8" width="8" height="8" rx="1"/>
          <rect x="48" y="12" width="6" height="6" rx="1"/>
          <rect x="38" y="24" width="6" height="6" rx="1"/>
          <rect x="52" y="22" width="8" height="8" rx="1"/>
          <rect x="10" y="38" width="8" height="8" rx="1"/>
          <rect x="22" y="44" width="6" height="6" rx="1"/>
          <rect x="72" y="38" width="6" height="6" rx="1"/>
          <rect x="84" y="42" width="8" height="8" rx="1"/>
          <rect x="38" y="72" width="8" height="8" rx="1"/>
          <rect x="50" y="76" width="6" height="6" rx="1"/>
          <rect x="68" y="68" width="8" height="8" rx="1"/>
          <rect x="80" y="78" width="8" height="8" rx="1"/>
          <rect x="70" y="84" width="6" height="6" rx="1"/>
        </svg>

        <!-- Center Mascot Badge -->
        <div class="qr-center-logo">
          <svg viewBox="0 0 127.14 96.36" fill="#FFFFFF">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
          </svg>
        </div>
      </div>

      <h2 class="qr-title">Log in with QR Code</h2>
      <p class="qr-desc">
        Scan this with the <strong>Discord mobile app</strong> to log in instantly.
      </p>
    </div>

  </div>

</body>
</html>
